name: ghana_buildings
channels:
  - conda-forge
  - defaults

dependencies:
  # ── Core Python ─────────────────────────────────────────────────────────────
  - python=3.11
  - pip

  # ── Spatial data processing ──────────────────────────────────────────────────
  - geopandas>=0.14
  - shapely>=2.0
  - pyogrio>=0.7          # fast GeoPackage / GeoParquet I/O
  - fiona>=1.9
  - rasterio>=1.3
  - xarray>=2023.6
  - rioxarray>=0.15
  - gdal>=3.7
  - pyproj>=3.6

  # ── Data formats ─────────────────────────────────────────────────────────────
  - geoparquet           # GeoParquet support via pyarrow
  - pyarrow>=14
  - fastparquet

  # ── Spatial statistics ────────────────────────────────────────────────────────
  - libpysal>=4.9
  - esda>=2.5            # spatial autocorrelation (Moran's I, Gi*)
  - spreg>=1.4           # spatial regression
  - mgwr>=2.2            # multiscale geographically weighted regression

  # ── Machine learning ──────────────────────────────────────────────────────────
  - scikit-learn>=1.4
  - xgboost>=2.0
  - lightgbm>=4.2
  - shap>=0.44
  - hdbscan>=0.8

  # ── Numerical / data ─────────────────────────────────────────────────────────
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11

  # ── Visualisation ────────────────────────────────────────────────────────────
  - matplotlib>=3.8
  - seaborn>=0.13
  - plotly>=5.18
  - contextily>=1.4      # basemap tiles for matplotlib

  # ── Networking / download ────────────────────────────────────────────────────
  - requests>=2.31
  - tqdm>=4.66
  - aiohttp>=3.9

  # ── Notebook / dev ────────────────────────────────────────────────────────────
  - jupyterlab>=4.0
  - ipykernel
  - ipywidgets

  # ── Utilities ────────────────────────────────────────────────────────────────
  - python-dotenv
  - pyyaml
  - rich                 # pretty terminal logging

  # ── pip-only packages ────────────────────────────────────────────────────────
  - pip:
    - earthengine-api>=0.1.390   # Google Earth Engine
    - geemap>=0.31               # GEE + folium helpers
    - overturemaps>=0.7          # Overture Maps CLI / Python client
    - osmnx>=1.9                 # OSM road / POI download
    - cenpy                      # census data (if needed for US validation refs)
